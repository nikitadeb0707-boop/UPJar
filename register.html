<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | UpJar</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-body">

    <div class="auth-container">

        <a href="index.html" class="logo auth-logo">
            <span class="logo-icon">✦</span>
            UpJar
        </a>


        <div class="auth-box">

            <h1>
                Create your account
            </h1>

            <p>
                Start turning your spare change into a habit.
            </p>


            <form id="registerForm">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Create a password"
                    required
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <button type="submit" class="auth-btn">
                    Create Account →
                </button>

            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <p class="demo-note">
                Demo prototype — no real financial information required.
            </p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
